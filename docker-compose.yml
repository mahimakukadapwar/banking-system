services:
  db:
    image: mysql:8
    container_name: mysql-bank
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: banking_db
    ports:
      - "3307:3306"

  app:
    build: .
    container_name: banking-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: root
      DB_PASSWORD: root123
      JWT_SECRET: mySecretKeyForBankingApplicationWithMinimumLengthRequirement1234567890
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/banking_db
    depends_on:
      - db